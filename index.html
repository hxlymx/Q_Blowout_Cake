
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday AQ!</title>

    
<link href="https://fonts.googleapis.com/css2?family=Stalinist+One&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & LAYOUT --- */
        body {
            background: radial-gradient(circle at center, #1a100c 0%, #000000 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Prevents scrollbar */
            color: white;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* --- TEXT STYLES --- */
        .title {
            position: absolute;
            top: 2%; /* Moved higher */
            width: 100%;
            text-align: center;
            
            font-family: 'Stalinist One', cursive;
            font-size: clamp(28px, 5vw, 44px);
            line-height: 1.6;
            
            background: linear-gradient(to right, #d4af37, #fdf5c4, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            z-index: 20;
        }

        .big-q {
            font-size: 1.2em;
        }

        /* --- CAKE CONTAINER (IMAGE BASED) --- */
        .cake-container {
            position: relative;
            width: 320px; 
            height: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            
            /* ADJUSTMENT 1: Reduced margin-top to move the cake higher up and save vertical space */
            margin-top: 100px; 
            
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));
        }

        .cake-image {
            width: 100%;
            height: auto;
            display: block;
            position: relative;
            z-index: 5; 
        }

        /* --- CANDLES --- */
        .candles-container {
            position: absolute;
            /* Adjusted to push the entire group down onto the cake surface */
            top: 5px; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            display: flex;
            gap: 30px; 
        }

        .candle-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            /* Set a fixed height that accommodates the letter and the stick */
            height: 100px; 
            width: 60px;
        }

        /* The Letter (In Front) */
        .candle-letter {
            position: absolute; /* positioned relative to wrapper */
            /* Default position for Q */
            top: 15px; 
            font-size: 55px;
            font-weight: 900;
            /* Metallic Gold */
            background: radial-gradient(ellipse at center, #fcf6ba 0%, #bf953f 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 0px rgba(139, 101, 8, 0.8));
            animation: glitter 3s ease infinite;
            z-index: 10; /* HIGHER THAN STICK */
        }

        /* The Stick (Behind) */
        .stick {
            position: absolute;
            /* Adjusted to start below the letter (55px height + 15px offset = 70px) */
            top: 70px; 
            width: 6px;
            height: 28px; /* Shortened stick length to not stick out too much */
            background: #5a2d0c; /* Brown */
            z-index: 1; /* LOWER THAN LETTER */
            border-radius: 2px;
            box-shadow: inset -1px 0 2px rgba(0,0,0,0.2);
        }

        /* --- FLAMES --- */
        .flame {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%) scale(1);
            width: 24px;
            height: 34px;
            background: radial-gradient(circle at 50% 80%, #e0b0ff, #9a4ecc 40%, #5e1e85 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 0 25px 6px rgba(154, 78, 204, 0.9);
            filter: blur(0.5px);
            animation: flicker 0.1s infinite alternate;
            transform-origin: center bottom;
            transition: opacity 0.5s, transform 0.5s;
            opacity: 0; 
            z-index: 11; 
        }

        .flame::before {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 6px;
            background: #333;
        }

        /* Animations */
        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) skewX(0deg); opacity: 1; }
            25% { transform: translateX(-50%) scale(1.1, 0.9) skewX(-2deg); opacity: 0.95; }
            50% { transform: translateX(-50%) scale(0.9, 1.1) skewX(2deg); opacity: 1; }
            75% { transform: translateX(-50%) scale(1.05, 0.95) skewX(-1deg); opacity: 0.95; }
            100% { transform: translateX(-50%) scale(1) skewX(0deg); opacity: 1; }
        }

        @keyframes glitter {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- UI --- */
        #startBtn {
            /* ADJUSTMENT 1: Reduced margin-top to ensure the button is not cut off */
            margin-top: 20px; 
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            color: #4e2c1d;
            background: linear-gradient(to bottom, #ffd700, #daa520);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(218, 165, 32, 0.4);
            transition: transform 0.2s;
            z-index: 100;
        }

        #startBtn:active {
            transform: scale(0.95);
        }

        /* Message */
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            text-align: center;
            z-index: 100;
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.27);
            width: 90%; /* Use 90% width for better mobile fit */

            /* ADJUSTMENT 2: Frosted Glass / Glow effect for better contrast */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); 
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(224, 176, 255, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.3); /* Purple glow */
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #message.show {
            transform: translate(-50%, -50%) scale(1);
        }

        #message h2 {
            font-size: clamp(26px, 6vw, 42px);
            margin: 0;
            line-height: 1.2;
            font-family: 'Brush Script MT', cursive;
            background: linear-gradient(to bottom, #cccc00 0%, #b3b300 50%, #cccc00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 1px 0px rgba(140,0,160,0.4));
            letter-spacing: 2px;
        }
        
        #fxCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

    </style>
</head>
<body>

    <canvas id="fxCanvas"></canvas>

    <div class="container">
        <h1 class="title">HAPPY BIRTHDAY<br>FINE BOY <span class="big-q">Q</span>UE!!!</h1>

        <div class="cake-container">
            <!-- Cake Image --><img src="https://png.pngtree.com/png-vector/20241219/ourmid/pngtree-chocolate-cake-with-dripping-caramel-glaze-and-lit-candles-perfect-for-png-image_14823283.png" alt="Chocolate Cake" class="cake-image">
            
            <!-- CANDLES OVERLAY (Corrected Structure for Z-Index) --><div class="candles-container">
                <div class="candle-wrapper">
                    <!-- Stick is first, with z-index: 1 --><div class="stick"></div>
                    <!-- Letter A: Increased top offset to align with stick -->
                    <div class="candle-letter" style="top: 20px;">A 
                        <div class="flame" id="flame1"></div>
                    </div>
                </div>
                <div class="candle-wrapper">
                    <div class="stick"></div>
                    <!-- Letter Q: Uses the default 15px offset from the CSS class -->
                    <div class="candle-letter">Q
                        <div class="flame" id="flame2"></div>
                    </div>
                </div>
            </div>
        </div>

        <button id="startBtn">Enable Mic To Blowout Candles</button>

        <div id="message">
            <h2>Wishing You The Sweetest Year! <br>May All Your Prayers & Wishes Come True! <span class="small-heart">♡</span></h2>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const BLOW_THRESHOLD = 110; // Sensitivity
        const FLAMES = document.querySelectorAll('.flame');
        const START_BTN = document.getElementById('startBtn');
        const MESSAGE = document.getElementById('message'); 
        
        let audioContext, analyser, dataArray;
        let isListening = false;
        let candlesOut = false;

        const canvas = document.getElementById('fxCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- CANDLE LIGHTING LOGIC PRESERVED ---
        START_BTN.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                START_BTN.style.display = 'none';

                // Turn flames ON visually
                FLAMES.forEach(f => {
                    f.style.opacity = '1';              
                    f.style.transform = 'translateX(-50%) scale(1)';
                    f.style.animation = 'flicker 0.12s infinite alternate';
                });

                isListening = true;
                loop();

            } catch (err) {
                // Using a custom message box instead of alert()
                const errorMessage = document.createElement('div');
                errorMessage.style.cssText = `
                    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                    background: #ff4d4d; color: white; padding: 20px; border-radius: 10px; 
                    box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 9999; text-align: center;
                `;
                errorMessage.innerHTML = '<h3>Microphone Access Denied</h3><p>Tap the cake to blow out!</p>';
                document.body.appendChild(errorMessage);
                
                document.querySelector('.cake-container').addEventListener('click', blowOut);
                START_BTN.style.display = 'none';
                FLAMES.forEach(f => {
                    f.style.opacity = '1';
                    f.style.animation = 'flicker 0.1s infinite alternate';
                });

                setTimeout(() => errorMessage.remove(), 4000); // Remove message after 4 seconds
            }
        });

        function loop() {
            if (isListening && !candlesOut) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length / 2; i++) {
                    sum += dataArray[i];
                }
                const average = sum / (dataArray.length / 2);
                if (average > BLOW_THRESHOLD) blowOut();
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (particles.length > 0) {
                particles.forEach((p, index) => {
                    p.update();
                    p.draw();
                    if (p.life <= 0) particles.splice(index, 1);
                });
            }
            requestAnimationFrame(loop);
        }

        function blowOut() {
            if (candlesOut) return;
            candlesOut = true;
            isListening = false;

            // Extinguish Flames
            FLAMES.forEach(f => {
                f.style.animation = 'none'; 
                f.style.transition = 'all 0.5s'; 
                f.style.opacity = '0';
                f.style.transform = 'translateX(-50%) scale(0)';
            });

            setTimeout(() => {
                MESSAGE.classList.add('show');
                createSparklers(); 
                createConfetti();  
            }, 200);
        }

        // --- FX PARTICLES ---
        class Spark {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; 
                
                if (type === 'sparkler') {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 4 + 2;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.life = 100;
                    this.decay = Math.random() * 2 + 1;
                    this.color = `hsl(${Math.random() * 40 + 30}, 100%, 70%)`; 
                    this.gravity = 0.1;
                } else {
                    // Confetti
                    this.vx = (Math.random() - 0.5) * 4;
                    this.vy = (Math.random() - 0.5) * 4 - 5; 
                    this.life = 200;
                    this.decay = 0.5;
                    const colors = ['#800080', '#FFD700', '#FFFF00'];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.isGold = this.color === '#FFD700';
                    this.gravity = 0.15;
                    this.rotation = Math.random() * 360;
                    this.rotationSpeed = (Math.random() - 0.5) * 10;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity; 
                this.life -= this.decay;
                if (this.type === 'confetti') {
                    this.rotation += this.rotationSpeed;
                    this.vx *= 0.99; 
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.type === 'sparkler') {
                    ctx.globalAlpha = this.life / 100;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.globalAlpha = Math.min(1, this.life / 100);
                    ctx.rotate(this.rotation * Math.PI / 180);
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-4, -2, 8, 4);
                    if (this.isGold && Math.random() > 0.8) {
                         ctx.fillStyle = '#FFF';
                         ctx.beginPath();
                         ctx.arc(Math.random()*8-4, Math.random()*4-2, 1, 0, Math.PI*2);
                         ctx.fill();
                    }
                }
                ctx.restore();
            }
        }

        function createSparklers() {
            const candleRect = document.querySelector('.candles-container').getBoundingClientRect();
            const originX = candleRect.left + candleRect.width / 2;
            const originY = candleRect.top + candleRect.height / 2;
            let bursts = 0;
            const burstInterval = setInterval(() => {
                for (let i = 0; i < 20; i++) particles.push(new Spark(originX, originY, 'sparkler'));
                bursts++;
                if (bursts > 10) clearInterval(burstInterval);
            }, 100);
        }

        function createConfetti() {
            for (let i = 0; i < 100; i++) particles.push(new Spark(window.innerWidth / 2, window.innerHeight / 2, 'confetti'));
            let rainDuration = 0;
            const rainInterval = setInterval(() => {
                particles.push(new Spark(Math.random() * window.innerWidth, -10, 'confetti'));
                rainDuration++;
                if (rainDuration > 50) clearInterval(rainInterval);
            }, 50);
        }
    </script>
</body>
</html>
