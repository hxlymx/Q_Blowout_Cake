<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Happy Birthday AQ!</title>
<style>
/* ----------------------
   Layout + Background
   ----------------------*/
html,body{height:100%;margin:0}
body{
  background: radial-gradient(circle at center, #1a100c 0%, #000000 100%);
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* container */
.container{
  width:100%;
  max-width:720px;
  margin:0 auto;
  padding:24px;
  box-sizing:border-box;
  text-align:center;
  position:relative;
}

/* Title */
.title{
  font-weight:800;
  font-size:clamp(22px,4vw,38px);
  margin:0 0 8px 0;
  background:linear-gradient(90deg,#d4af37,#fdf5c4,#d4af37);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 2px 8px rgba(0,0,0,0.5);
}

/* instructions */
.instructions{
  color:#bfa98a;
  font-size:14px;
  margin-top:6px;
  opacity:0.95;
}

/* ----------------------
   Cake area
   ----------------------*/
.cake-wrap{
  position:relative;
  width:320px;
  margin:28px auto 0;
  height:360px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  filter: drop-shadow(0 18px 30px rgba(0,0,0,0.7));
}

/* Generic tier */
.tier{
  position:relative;
  border-radius:50% / 14%;
  background:
    linear-gradient(90deg,#3e2723 0%, #6d4c41 45%, #3e2723 100%);
  box-shadow:inset 0 -6px 14px rgba(0,0,0,0.55), inset 0 6px 10px rgba(255,255,255,0.03);
  overflow:visible;
}

/* top surfaces */
.tier::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:28px;
  background:radial-gradient(circle at 30% 30%, #6d4c41, #3e2723);
  border-radius:50%;
  transform:translateY(-50%);
  z-index:3;
  box-shadow: inset 0 2px 6px rgba(255,255,255,0.06);
}

/* sizes and stacking (smaller -> higher z) */
.tier.bottom{ width:260px; height:100px; z-index:10; margin-bottom:-18px; }
.tier.middle{ width:200px; height:85px; z-index:20; margin-bottom:-18px; }
.tier.top{ width:150px; height:74px; z-index:30; margin-bottom:0; display:flex; justify-content:center; align-items:flex-start; }

/* icing layer (ganache drips) */
.icing-layer{
  position:absolute;
  top:-18px;
  left:-2%;
  width:104%;
  height:100%;
  pointer-events:none;
  z-index:4;
}
.icing-cap{
  position:absolute;
  top:0; left:2%;
  width:96%; height:30px;
  background: radial-gradient(circle at 40% 20%, #5d4037 0%, #2e1a12 60%);
  border-radius:50%;
  box-shadow: inset 0 6px 10px rgba(255,255,255,0.03);
  z-index:5;
}
.drips{ position:absolute; top:18px; left:2%; width:96%; display:flex; justify-content:space-between; align-items:flex-start; padding:0 6px; box-sizing:border-box; }
.drip{ background:#2e1a12; border-radius:0 0 20px 20px; box-shadow: inset 2px -2px 4px rgba(255,255,255,0.06); }
.drip.short{ height:22px; width:10px; }
.drip.med{ height:36px; width:12px; }
.drip.long{ height:52px; width:14px; }
.drip.wide{ height:44px; width:18px; border-radius:0 0 26px 26px; }

/* ----------------------
   Sprinkles
   ----------------------*/
.sprinkles{ position:absolute; top:12px; left:0; width:100%; height:40px; z-index:6; pointer-events:none; }
.sprinkle{
  position:absolute;
  width:6px;
  height:2px;
  border-radius:2px;
  transform: rotate(var(--r,0deg));
  background:var(--c, #FFD700);
  box-shadow:0 0 4px rgba(0,0,0,0.2);
  opacity:0.95;
  transition:opacity .6s;
}
/* tiny glitter dot for gold sprinkles */
.sprinkle.glitter::after{
  content:''; position:absolute; right:-1px; top:-1px; width:2px; height:2px; border-radius:50%; background:white; opacity:0.9;
}

/* ----------------------
   Candles / Letters / Flames
   ----------------------*/
.candles-container{
  position:absolute;
  top:-56px; /* sit above the top tier */
  left:50%;
  transform:translateX(-50%);
  z-index:40;
  display:flex;
  gap:14px;
  align-items:flex-end;
  pointer-events:auto;
}

/* letter candle (AQ) */
.candle-letter{
  position:relative;
  display:inline-flex;
  align-items:flex-end;
  justify-content:center;
  font-weight:900;
  font-size:52px;
  line-height:1;
  color:transparent;
  -webkit-background-clip:text;
  background:linear-gradient(135deg,#f9e8a0,#c89b2e 60%, #f7e7b2);
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6));
}

/* candle stick BELOW the letter - a pseudo element */
.candle-letter::after{
  content:'';
  position:absolute;
  bottom:-10px;   /* slightly negative to tuck into the tier top */
  left:50%;
  transform:translateX(-50%);
  width:6px;
  height:50px;
  background: linear-gradient(180deg,#fff,#f1f1f1);
  border-radius:3px;
  z-index:2;
  box-shadow:0 3px 8px rgba(0,0,0,0.5), inset -1px 0 2px rgba(0,0,0,0.08);
}

/* flame *inside* each letter container */
.flame{
  position:absolute;
  top:-52px; /* above the letter */
  left:50%;
  transform:translateX(-50%) scale(1);
  width:26px;
  height:38px;
  border-radius:50% 50% 40% 40% / 60% 60% 40% 40%;
  background: radial-gradient(circle at 50% 70%, #e8c6ff 10%, #9a4ecc 45%, #4b0070 100%);
  box-shadow: 0 0 28px 8px rgba(154,78,204,0.85);
  filter: blur(0.4px);
  transform-origin:bottom center;
  opacity:0;               /* OFF by default */
  transition:opacity .45s ease, transform .45s ease;
  animation:flicker 0.12s infinite alternate;
  z-index:10;
}
.flame.lit{ opacity:1; }

/* small wick visible at base of flame */
.flame::before{
  content:''; position:absolute; bottom:-5px; left:50%; transform:translateX(-50%); width:2px; height:6px; background:#111;
}

/* flicker keyframes */
@keyframes flicker {
  0%{ transform: translateX(-50%) scale(1) skewX(0deg); }
  50%{ transform: translateX(-50%) scale(1.08,0.95) skewX(-2deg); }
  100%{ transform: translateX(-50%) scale(0.95,1.05) skewX(2deg); }
}

/* ----------------------
   Button / Message / Canvas
   ----------------------*/
#startBtn{
  margin-top:18px;
  padding:12px 22px;
  border-radius:999px;
  border:none;
  background:linear-gradient(180deg,#ffd84d,#d6a200);
  color:#4f3410;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(214,162,0,0.18);
}
#startBtn:active{ transform:scale(.98) }

.instructions{ margin-top:10px }

/* final message popup */
#message{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0);
  z-index:80;
  pointer-events:none;
  width:88%;
  max-width:560px;
  text-align:center;
  transition:transform .6s cubic-bezier(.17,.88,.32,1.2);
}
#message.show{ transform:translate(-50%,-50%) scale(1); }
#message h2{ font-size:34px; margin:0; line-height:1.05;
  background:linear-gradient(180deg,#e0b0ff,#9932cc); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  text-shadow:0 2px 6px rgba(0,0,0,0.6);
}
#message p{ margin-top:10px; font-size:18px; color:#f1e0ff }

/* sparkle elements for celebration (created by JS) */
.sparkle{
  position:fixed; pointer-events:none; width:6px; height:6px; border-radius:50%;
  box-shadow:0 0 6px rgba(255,255,255,0.85);
  opacity:1; transform:translate(-50%,-50%);
}

/* confetti canvas */
#fxCanvas{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:60; }

/* small heart */
.small-heart{ font-size:0.7em; vertical-align:middle; opacity:0.9; margin-left:6px; }

/* responsive reduce size */
@media (max-width:420px){
  .cake-wrap{ width:260px; height:300px }
  .candle-letter{ font-size:42px }
  .flame{ width:20px; height:30px; top:-44px }
}
</style>
</head>
<body>

<!-- hidden reference image uploaded earlier (optional) -->
<img id="refImage" src="/mnt/data/20C41690-0E0C-4755-AC02-E3ADFCD80887.jpeg" alt="" style="display:none">

<div class="container">
  <h1 class="title">HAPPY BIRTHDAY FINE BOY QUE!!!</h1>
  <div class="instructions" id="statusText">Press the button to light the candles</div>

  <div class="cake-wrap" aria-hidden="false">
    <!-- bottom -->
    <div class="tier bottom" id="tier-bottom">
      <div class="icing-layer">
        <div class="icing-cap"></div>
        <div class="drips">
          <div class="drip short"></div><div class="drip med"></div><div class="drip long"></div><div class="drip wide"></div>
          <div class="drip short"></div><div class="drip long"></div><div class="drip med"></div><div class="drip short"></div><div class="drip med"></div>
        </div>
      </div>
      <!-- sprinkles will be injected here by JS -->
      <div class="sprinkles" data-tier="bottom"></div>
    </div>

    <!-- middle -->
    <div class="tier middle" id="tier-middle">
      <div class="icing-layer">
        <div class="icing-cap"></div>
        <div class="drips">
          <div class="drip med"></div><div class="drip wide"></div><div class="drip short"></div><div class="drip long"></div>
          <div class="drip short"></div><div class="drip med"></div><div class="drip long"></div><div class="drip short"></div>
        </div>
      </div>
      <div class="sprinkles" data-tier="middle"></div>
    </div>

    <!-- top -->
    <div class="tier top" id="tier-top">
      <!-- candles sit here -->
      <div class="candles-container" aria-hidden="false">
        <div class="candle-letter" id="candleA">A<div class="flame" id="flameA"></div></div>
        <div class="candle-letter" id="candleQ">Q<div class="flame" id="flameQ"></div></div>
      </div>

      <div class="icing-layer">
        <div class="sprinkles" data-tier="top"></div>
        <div class="icing-cap"></div>
        <div class="drips">
          <div class="drip long"></div><div class="drip short"></div><div class="drip med"></div><div class="drip long"></div>
          <div class="drip short"></div><div class="drip med"></div><div class="drip wide"></div>
        </div>
      </div>
    </div>
  </div>

  <button id="startBtn">Enable Mic & Light Candles</button>

  <div id="message" aria-live="polite">
    <h2>Wishing You The Sweetest Birthday Ever!!! <span class="small-heart">♡</span></h2>
    <p>MORE LIFE, MORE BLESSINGS, MORE MONEY & TING!</p>
  </div>
</div>

<canvas id="fxCanvas"></canvas>

<script>
/* ============================
   Utility + Initialization
   ============================ */
const START_BTN = document.getElementById('startBtn');
const STATUS_TEXT = document.getElementById('statusText');
const FLAMES = [document.getElementById('flameA'), document.getElementById('flameQ')];
const MESSAGE = document.getElementById('message');
const FX_CANVAS = document.getElementById('fxCanvas');
const FX = FX_CANVAS.getContext('2d');

let audioContext = null, analyser = null, dataArray = null;
let isListening = false, candlesOut = false;
let ambientBaseline = 0;
let consecutiveBlowFrames = 0;

/* resize canvas */
function resizeCanvas(){
  FX_CANVAS.width = window.innerWidth;
  FX_CANVAS.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

/* ---------------------------
   Sprinkles generator
   --------------------------- */
function createSprinklesFor(tierSelector, count=18){
  const container = document.querySelector(`.sprinkles[data-tier="${tierSelector}"]`);
  if(!container) return;
  const width = container.parentElement.clientWidth;
  const height = 40; // sprinkle area
  const palette = ["#FFD700","#E6C200","#B8860B","#8B4513","#F8E7B6"];
  for(let i=0;i<count;i++){
    const d = document.createElement('div');
    d.className = 'sprinkle';
    const left = Math.round(Math.random() * (width - 20));
    const top = Math.round(Math.random() * (height - 8));
    const rot = (Math.random()*160 - 80).toFixed(1) + 'deg';
    const color = palette[Math.floor(Math.random()*palette.length)];
    d.style.left = left + 'px';
    d.style.top = top + 'px';
    d.style.setProperty('--r', rot);
    d.style.setProperty('--c', color);
    if(Math.random() > 0.85) d.classList.add('glitter'); // occasional glitter highlight
    container.appendChild(d);
  }
}
/* generate sprinkles on all tiers */
createSprinklesFor('top', 20);
createSprinklesFor('middle', 18);
createSprinklesFor('bottom', 22);

/* ---------------------------
   Candle lighting logic
   --------------------------- */
function lightCandlesUI(){
  FLAMES.forEach(f => {
    f.classList.add('lit');
    f.style.opacity = '1';
    // small scale pop
    f.style.transform = 'translateX(-50%) scale(1.05)';
    setTimeout(()=> f.style.transform = 'translateX(-50%) scale(1)', 350);
  });
}

/* ensure flames are OFF on load */
FLAMES.forEach(f => f.classList.remove('lit'), f => f.style.opacity = 0);

/* ---------------------------
   Microphone calibration + listening
   --------------------------- */
async function enableMicAndListen(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(stream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    // calibrate ambient for 1.2s
    STATUS_TEXT.textContent = 'Calibrating ambient noise...';
    let samples = [], start = performance.now();
    while(performance.now() - start < 1200){
      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for(let i=0;i<dataArray.length;i++) sum += dataArray[i];
      samples.push(sum / dataArray.length);
      await new Promise(r => setTimeout(r, 50));
    }
    ambientBaseline = samples.reduce((a,b)=>a+b,0)/samples.length;
    // set a dynamic threshold
    const dynamicThreshold = Math.max(120, Math.round(ambientBaseline * 2.0 + 30));
    window._BLOW_THRESHOLD = dynamicThreshold;

    STATUS_TEXT.textContent = 'Blow into your microphone to make a wish!';
    isListening = true;
    listenLoop();
  } catch (e){
    console.warn('Mic denied or unavailable', e);
    STATUS_TEXT.textContent = 'Microphone unavailable — tap the cake to blow out';
    // fallback: allow click/tap to blow
    document.querySelector('.cake-wrap').addEventListener('click', () => { if(!candlesOut) blowOut(); });
  }
}

/* detection loop with debounce: require N consecutive frames above threshold */
async function listenLoop(){
  if(!analyser || !dataArray) return;
  analyser.getByteFrequencyData(dataArray);
  // prefer low-frequency energy for breath: sum first N bins
  let bins = Math.max(16, Math.floor(dataArray.length * 0.15));
  let sum = 0;
  for(let i=0;i<bins;i++) sum += dataArray[i];
  const avg = sum / bins;

  const threshold = window._BLOW_THRESHOLD || 140;
  // require a noticeable jump above ambient and sustained frames
  if(avg > threshold) {
    consecutiveBlowFrames++;
  } else {
    consecutiveBlowFrames = Math.max(0, consecutiveBlowFrames - 1);
  }
  if(consecutiveBlowFrames >= 3 && !candlesOut) {
    blowOut();
  }
  requestAnimationFrame(listenLoop);
}

/* ---------------------------
   Start button handler
   --------------------------- */
START_BTN.addEventListener('click', async () => {
  START_BTN.disabled = true;
  START_BTN.style.opacity = 0.6;
  // light candles visually and enable mic
  lightCandlesUI();
  STATUS_TEXT.textContent = 'Enabling microphone...';
  await enableMicAndListen();
});

/* ---------------------------
   Blow out: extinguish flames + celebrate
   --------------------------- */
function blowOut(){
  if(candlesOut) return;
  candlesOut = true;
  isListening = false;

  // extinguish flames
  FLAMES.forEach(f=>{
    f.classList.remove('lit');
    f.style.animation = 'none';
    f.style.transition = 'all 0.5s ease';
    f.style.opacity = 0;
    f.style.transform = 'translateX(-50%) scale(0.5)';
  });

  STATUS_TEXT.style.opacity = 0;
  START_BTN.style.display = 'none';

  // small delay then celebration
  setTimeout(()=> {
    MESSAGE.classList.add('show');
    createSparklers();
    createConfetti();
  }, 240);
}

/* ============================
   Particle systems: sparklers & confetti
   ============================ */

/* helper: emit N sparkles near candle position */
function createSparklers(){
  const candleBox = document.querySelector('.candles-container').getBoundingClientRect();
  const cx = candleBox.left + candleBox.width/2;
  const cy = candleBox.top + 10;

  for(let burst=0; burst<10; burst++){
    setTimeout(()=> {
      for(let i=0;i<18;i++){
        spawnSpark(cx + (Math.random()*80-40), cy + (Math.random()*20-10));
      }
    }, burst * 80);
  }
}

/* spawn single sparkle (small glowing particle) */
function spawnSpark(x,y){
  const el = document.createElement('div');
  el.className = 'sparkle';
  document.body.appendChild(el);
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.background = ['#FFD966','#FFF3B0','#FFE082'][Math.floor(Math.random()*3)];
  el.style.opacity = 1;
  const angle = Math.random() * Math.PI * 2;
  const distance = 60 + Math.random() * 80;
  el.animate([
    { transform: 'translate(-50%,-50%) scale(1)', opacity:1 },
    { transform: `translate(${Math.cos(angle)*distance}px, ${Math.sin(angle)*distance}px) scale(.2)`, opacity:0 }
  ], { duration: 700 + Math.random()*500, easing:'cubic-bezier(.2,.9,.3,1)', fill:'forwards' });
  setTimeout(()=> el.remove(), 1400);
}

/* CONFETTI: canvas-based (purple / gold / glitter) */
let confettiPieces = [];
function createConfetti(){
  const colors = ['#8E44AD','#9B59B6','#FFD700','#F1C40F','#EFD77A'];
  // initial burst
  for(let i=0;i<160;i++){
    confettiPieces.push({
      x: window.innerWidth/2 + (Math.random()*240 - 120),
      y: window.innerHeight/2 + (Math.random()*80 - 40),
      vx: (Math.random()-0.5)*6,
      vy: - (4 + Math.random()*8),
      w: 6 + Math.random()*8,
      h: 6 + Math.random()*6,
      rot: Math.random()*360,
      vr: (Math.random()-0.5)*8,
      color: colors[Math.floor(Math.random()*colors.length)],
      life: 160 + Math.random()*80
    });
  }
  if(!animatingConfetti) {
    animatingConfetti = true;
    requestAnimationFrame(confettiLoop);
  }
}
let animatingConfetti = false;
function confettiLoop(){
  FX.clearRect(0,0,FX_CANVAS.width, FX_CANVAS.height);
  for(let i=confettiPieces.length-1;i>=0;i--){
    const p = confettiPieces[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2; // gravity
    p.rot += p.vr;
    p.life--;
    // draw rectangle rotated
    FX.save();
    FX.translate(p.x, p.y);
    FX.rotate(p.rot * Math.PI/180);
    FX.fillStyle = p.color;
    FX.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    // glitter sparkle on gold pieces
    if(p.color === '#FFD700' && Math.random()>0.85){
      FX.fillStyle = 'rgba(255,255,255,0.9)';
      FX.fillRect(0, -p.h/2, 2, 2);
    }
    FX.restore();
    if(p.life <= 0 || p.y > FX_CANVAS.height + 50) confettiPieces.splice(i,1);
  }
  if(confettiPieces.length>0) requestAnimationFrame(confettiLoop);
  else animatingConfetti = false;
}

/* ============================
   UI: click-to-blow fallback
   ============================ */
document.querySelector('.cake-wrap').addEventListener('click', () => {
  if(!isListening && !candlesOut){
    // if mic not enabled, simulate lighting then blowing after short delay
    lightCandlesUI();
    setTimeout(()=> {
      // brief timeout to simulate user blow
      blowOut();
    }, 1100);
  }
});

</script>
</body>
</html>
