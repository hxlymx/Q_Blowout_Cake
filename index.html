

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Fine Boy Que!!!</title>
    <style>
        /* --- RESET & LAYOUT --- */
        body {
            /* Darker, moodier background to make the cake pop */
            background: radial-gradient(circle at center, #1a100c 0%, #000000 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: white;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* --- TEXT STYLES --- */
        .title {
            position: absolute;
            top: 5%;
            font-size: clamp(24px, 5vw, 40px);
            text-align: center;
            font-weight: 800;
            background: linear-gradient(to right, #d4af37, #fdf5c4, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            z-index: 20;
        }

        .instructions {
            margin-top: 20px;
            color: #8d6e63;
            font-size: 14px;
            font-weight: 500;
            animation: pulse 2s infinite;
        }

        /* --- THE REALISTIC CAKE --- */
        .cake-container {
            position: relative;
            width: 300px;
            height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin-top: 30px;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));
        }

        /* -- CAKE TEXTURE & SHAPE -- */
        .tier {
            position: relative;
            /* Realistic Chocolate Sponge Gradient */
            background: 
                linear-gradient(to right, #3e2723, #5d4037 20%, #6d4c41 50%, #5d4037 80%, #3e2723),
                url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMDUiLz4KPC9zdmc+'); /* Noise texture */
            border-radius: 50% / 10%; /* Cylindrical perspective */
            box-shadow: 
                inset 0 -5px 10px rgba(0,0,0,0.5), /* Bottom shadow */
                inset 0 5px 10px rgba(255,255,255,0.05); /* Top highlight */
        }

        /* The "Top" surface of the cylinder */
        .tier::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 30px; 
            background: radial-gradient(circle at 30% 30%, #6d4c41, #3e2723);
            border-radius: 50%;
            transform: translateY(-50%);
            z-index: 1;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.1);
        }

        /* Tier Dimensions */
        .tier.bottom {
            width: 280px;
            height: 90px;
            z-index: 10;
        }

        .tier.middle {
            width: 210px;
            height: 80px;
            z-index: 20;
            margin-bottom: -15px;
        }

        .tier.top {
            width: 150px;
            height: 70px;
            z-index: 30;
            margin-bottom: -15px;
            display: flex;
            justify-content: center;
        }

        /* --- REALISTIC DRIPPY ICING --- */
        /* Container for drips */
        .icing-layer {
            position: absolute;
            top: -15px; /* Pull up to cover the rim */
            left: -2%;
            width: 104%; /* Slightly wider than cake */
            height: 100%;
            pointer-events: none;
            z-index: 5;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
        }

        /* The smooth top cap of the icing */
        .icing-cap {
            position: absolute;
            top: 0;
            left: 2%; /* Re-center inside the widened container */
            width: 96%;
            height: 30px;
            background: #2e1a12; /* Dark Ganache */
            border-radius: 50%;
            z-index: 2;
            /* Glossy reflection */
            background: radial-gradient(circle at 40% 20%, #5d4037 0%, #2e1a12 60%);
        }

        /* Individual Drips container */
        .drips {
            position: absolute;
            top: 15px; /* Start below the cap center */
            left: 2%;
            width: 96%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 5px;
            box-sizing: border-box;
        }

        /* The drip shapes */
        .drip {
            background: #2e1a12; /* Matches ganache */
            width: 12px;
            border-radius: 0 0 20px 20px;
            box-shadow: inset 2px -2px 4px rgba(255,255,255,0.1);
        }

        /* Randomize Drip Heights using CSS classes */
        .drip.long { height: 50px; width: 14px; }
        .drip.med { height: 35px; width: 12px; }
        .drip.short { height: 20px; width: 10px; }
        .drip.wide { height: 40px; width: 18px; border-radius: 0 0 25px 25px; }
        
        /* Connect the drips with a "rim" so no gaps appear at top */
        .drips::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            height: 15px;
            background: #2e1a12;
        }

        /* --- SPRINKLES (Browns & Golds) --- */
        .sprinkles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            border-radius: 50% / 10%;
            overflow: hidden;
        }

        .sprinkles::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            /* Palette: Browns and Gold sparkles */
            box-shadow: 
                20px 40px 0 #8B4513, 50px 50px 0 #D2691E, 80px 30px 1px #FFD700,
                110px 60px 0 #A0522D, 140px 45px 0 #DAA520, 170px 35px 0 #8B4513,
                30px 70px 1px #FFD700, 60px 80px 0 #D2691E, 90px 65px 0 #A0522D,
                120px 75px 1px #FFD700, 200px 50px 0 #8B4513, 230px 60px 0 #DAA520;
            opacity: 0.9;
            /* Slow rotation to shimmer */
            animation: shimmerSprinkles 4s ease-in-out infinite alternate;
        }

        @keyframes shimmerSprinkles {
            from { transform: translateY(0); }
            to { transform: translateY(-2px); }
        }

        /* --- CANDLES --- */
        .candles-container {
            position: absolute;
            bottom: 35px; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            display: flex;
            gap: 15px;
        }

        .candle-letter {
            position: relative;
            font-size: 50px;
            font-weight: 900;
            background: radial-gradient(ellipse at center, #fcf6ba 0%, #bf953f 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 0px rgba(139, 101, 8, 0.8));
            animation: glitter 3s ease infinite;
        }

        /* Sticks */
        .candle-letter::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 15px;
            background: #eee;
            z-index: -1;
            border-radius: 2px;
            box-shadow: inset -1px 0 2px rgba(0,0,0,0.2);
        }

        /* --- FLAMES --- */
        .flame {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%) scale(1);
            width: 16px;
            height: 24px;
            background: radial-gradient(circle at 50% 80%, #e0b0ff, #9a4ecc 40%, #5e1e85 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 0 15px 4px rgba(154, 78, 204, 0.8);
            filter: blur(0.5px);
            animation: flicker 0.1s infinite alternate;
            transform-origin: center bottom;
            transition: opacity 0.5s, transform 0.5s;
            opacity: 0; 
        }

        .flame::before {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 6px;
            background: #333;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) skewX(0deg); opacity: 1; }
            25% { transform: translateX(-50%) scale(1.1, 0.9) skewX(-2deg); opacity: 0.95; }
            50% { transform: translateX(-50%) scale(0.9, 1.1) skewX(2deg); opacity: 1; }
            75% { transform: translateX(-50%) scale(1.05, 0.95) skewX(-1deg); opacity: 0.95; }
            100% { transform: translateX(-50%) scale(1) skewX(0deg); opacity: 1; }
        }

        @keyframes glitter {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* --- UI --- */
        #startBtn {
            margin-top: 40px;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            color: #4e2c1d;
            background: linear-gradient(to bottom, #ffd700, #daa520);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(218, 165, 32, 0.4);
            transition: transform 0.2s;
            z-index: 100;
        }

        #startBtn:active {
            transform: scale(0.95);
        }

        /* Message */
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            text-align: center;
            z-index: 100;
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.27);
            width: 100%;
        }

        #message.show {
            transform: translate(-50%, -50%) scale(1);
        }

        #message h2 {
            font-size: 60px;
            margin: 0;
            line-height: 1.2;
            /* FONT CHANGE APPLIED HERE */
            font-family: 'Brush Script MT', cursive;
            
            /* Metallic Purple Text */
            background: linear-gradient(to bottom, #E0B0FF 0%, #9932CC 50%, #4B0082 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 2px 0px rgba(255,255,255,0.3));
            letter-spacing: 2px;
        }
        
        #message p {
            font-size: 22px;
            margin-top: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        #fxCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

    </style>
</head>
<body>

    <canvas id="fxCanvas"></canvas>

    <div class="container">
        <h1 class="title">Happy Birthday Fine Boy Que!!!</h1>

        <div class="cake-container">
            
            <!-- TOP TIER -->
            <div class="tier top">
                <div class="candles-container">
                    <div class="candle-letter">A<div class="flame" id="flame1"></div></div>
                    <div class="candle-letter">Q<div class="flame" id="flame2"></div></div>
                </div>
                <!-- Realistic Icing Structure -->
                <div class="icing-layer">
                    <div class="icing-cap"></div>
                    <div class="drips">
                        <div class="drip long"></div>
                        <div class="drip short"></div>
                        <div class="drip med"></div>
                        <div class="drip long"></div>
                        <div class="drip short"></div>
                        <div class="drip med"></div>
                        <div class="drip wide"></div>
                    </div>
                </div>
                <div class="sprinkles"></div>
            </div>

            <!-- MIDDLE TIER -->
            <div class="tier middle">
                <div class="icing-layer">
                    <div class="icing-cap"></div>
                    <div class="drips">
                        <div class="drip med"></div>
                        <div class="drip wide"></div>
                        <div class="drip short"></div>
                        <div class="drip long"></div>
                        <div class="drip short"></div>
                        <div class="drip med"></div>
                        <div class="drip long"></div>
                        <div class="drip short"></div>
                    </div>
                </div>
                <div class="sprinkles"></div>
            </div>

            <!-- BOTTOM TIER -->
            <div class="tier bottom">
                <div class="icing-layer">
                    <div class="icing-cap"></div>
                    <div class="drips">
                        <div class="drip short"></div>
                        <div class="drip med"></div>
                        <div class="drip long"></div>
                        <div class="drip wide"></div>
                        <div class="drip short"></div>
                        <div class="drip long"></div>
                        <div class="drip med"></div>
                        <div class="drip short"></div>
                        <div class="drip med"></div>
                    </div>
                </div>
            </div>
        </div>

        <p class="instructions" id="statusText">Press button to light candles</p>
        <button id="startBtn">Enable Mic to Blow Candles</button>

        <div id="message">
            <h2> Wishing you the sweetest birthday ever!!! &#9825; </h2>
            
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const BLOW_THRESHOLD = 50; // Sensitivity
        const FLAMES = document.querySelectorAll('.flame');
        const START_BTN = document.getElementById('startBtn');
        const STATUS_TEXT = document.getElementById('statusText');
        const MESSAGE = document.getElementById('message');
        
        let audioContext, analyser, dataArray;
        let isListening = false;
        let candlesOut = false;

        const canvas = document.getElementById('fxCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        START_BTN.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                START_BTN.style.display = 'none';
                STATUS_TEXT.textContent = "Blow into your microphone to make a wish!";
                
                FLAMES.forEach(f => {
                    f.style.opacity = '1';
                    f.style.transform = 'translateX(-50%) scale(1)';
                    // Re-enable animation in case it was stopped
                    f.style.animation = 'flicker 0.1s infinite alternate';
                });

                isListening = true;
                loop();

            } catch (err) {
                alert("Microphone access denied. Tap the cake to blow out!");
                document.querySelector('.cake-container').addEventListener('click', blowOut);
                START_BTN.style.display = 'none';
                STATUS_TEXT.textContent = "Tap the cake to make a wish!";
                FLAMES.forEach(f => {
                    f.style.opacity = '1';
                    f.style.animation = 'flicker 0.1s infinite alternate';
                });
            }
        });

        function loop() {
            if (isListening && !candlesOut) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length / 2; i++) {
                    sum += dataArray[i];
                }
                const average = sum / (dataArray.length / 2);
                if (average > BLOW_THRESHOLD) blowOut();
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (particles.length > 0) {
                particles.forEach((p, index) => {
                    p.update();
                    p.draw();
                    if (p.life <= 0) particles.splice(index, 1);
                });
            }
            requestAnimationFrame(loop);
        }

        function blowOut() {
            if (candlesOut) return;
            candlesOut = true;
            isListening = false;

            // Extinguish Flames
            FLAMES.forEach(f => {
                f.style.animation = 'none'; 
                f.style.transition = 'all 0.5s'; 
                f.style.opacity = '0';
                f.style.transform = 'translateX(-50%) scale(0)';
            });

            STATUS_TEXT.style.opacity = '0';

            setTimeout(() => {
                MESSAGE.classList.add('show');
                createSparklers(); 
                createConfetti();  
            }, 200);
        }

        class Spark {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; 
                
                if (type === 'sparkler') {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 4 + 2;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.life = 100;
                    this.decay = Math.random() * 2 + 1;
                    this.color = `hsl(${Math.random() * 40 + 30}, 100%, 70%)`; 
                    this.gravity = 0.1;
                } else {
                    // Confetti
                    this.vx = (Math.random() - 0.5) * 4;
                    this.vy = (Math.random() - 0.5) * 4 - 5; 
                    this.life = 200;
                    this.decay = 0.5;
                    const colors = ['#800080', '#FFD700', '#FFFF00'];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.isGold = this.color === '#FFD700';
                    this.gravity = 0.15;
                    this.rotation = Math.random() * 360;
                    this.rotationSpeed = (Math.random() - 0.5) * 10;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity; 
                this.life -= this.decay;
                if (this.type === 'confetti') {
                    this.rotation += this.rotationSpeed;
                    this.vx *= 0.99; 
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.type === 'sparkler') {
                    ctx.globalAlpha = this.life / 100;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.globalAlpha = Math.min(1, this.life / 100);
                    ctx.rotate(this.rotation * Math.PI / 180);
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-4, -2, 8, 4);
                    if (this.isGold && Math.random() > 0.8) {
                         ctx.fillStyle = '#FFF';
                         ctx.beginPath();
                         ctx.arc(Math.random()*8-4, Math.random()*4-2, 1, 0, Math.PI*2);
                         ctx.fill();
                    }
                }
                ctx.restore();
            }
        }

        function createSparklers() {
            const candleRect = document.querySelector('.candles-container').getBoundingClientRect();
            const originX = candleRect.left + candleRect.width / 2;
            const originY = candleRect.top + candleRect.height / 2;
            let bursts = 0;
            const burstInterval = setInterval(() => {
                for (let i = 0; i < 20; i++) particles.push(new Spark(originX, originY, 'sparkler'));
                bursts++;
                if (bursts > 10) clearInterval(burstInterval);
            }, 100);
        }

        function createConfetti() {
            for (let i = 0; i < 100; i++) particles.push(new Spark(window.innerWidth / 2, window.innerHeight / 2, 'confetti'));
            let rainDuration = 0;
            const rainInterval = setInterval(() => {
                particles.push(new Spark(Math.random() * window.innerWidth, -10, 'confetti'));
                rainDuration++;
                if (rainDuration > 50) clearInterval(rainInterval);
            }, 50);
        }
    </script>
</body>
</html>
